<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>排球接球王 V2</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    background:#1b1b1b;
    color:white;
    text-align:center;
}

#header{
    padding:15px;
    font-size:22px;
    background:#111;
}

#game{
    position:relative;
    width:100%;
    max-width:900px;
    height:600px;
    margin:auto;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #7ec8ff 0%,
        #7ec8ff 55%,
        #d38f4f 55%,
        #c97d37 100%
    );
}

#net{
    position:absolute;
    left:0;
    right:0;
    top:55%;
    height:5px;
    background:white;
}

#partner{
    position:absolute;
    top:230px;
    left:50%;
    transform:translateX(-50%);
    font-size:90px;
}

#ball{
    position:absolute;
    font-size:45px;
    display:none;
}

#message{
    position:absolute;
    top:20px;
    width:100%;
    font-size:40px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#controls{
    max-width:900px;
    margin:auto;
    display:flex;
}

.controlBtn{
    flex:1;
    height:100px;
    border:none;
    font-size:50px;
    cursor:pointer;
}

#left{
    background:#2196F3;
}

#up{
    background:#4CAF50;
}

#right{
    background:#ff9800;
}

#startBtn{
    margin:10px;
    padding:12px 30px;
    font-size:22px;
}
</style>
</head>

<body>

<div id="header">
🏐 分數：<span id="score">0</span>
｜
🔥 Combo：<span id="combo">0</span>
</div>

<button id="startBtn" onclick="startGame()">
開始遊戲
</button>

<div id="game">

<div id="message"></div>

<div id="partner">🧍‍♂️</div>

<div id="net"></div>

<div id="ball">🏐</div>

</div>

<div id="controls">

<button
class="controlBtn"
id="left"
onclick="playerAction('left')">
↖
</button>

<button
class="controlBtn"
id="up"
onclick="playerAction('middle')">
↑
</button>

<button
class="controlBtn"
id="right"
onclick="playerAction('right')">
↗
</button>

</div>

<script>

let score = 0;
let combo = 0;
let gameRunning = false;

let currentAnswer = "";
let timeout;

const scoreText = document.getElementById("score");
const comboText = document.getElementById("combo");
const ball = document.getElementById("ball");
const msg = document.getElementById("message");

const lanes = [
    "left",
    "middle",
    "right"
];

function startGame(){

    clearTimeout(timeout);

    score = 0;
    combo = 0;

    updateUI();

    msg.innerHTML = "";
    gameRunning = true;

    spawnBall();
}

function updateUI(){

    scoreText.innerText = score;
    comboText.innerText = combo;
}

function spawnBall(){

    if(!gameRunning) return;

    ball.style.display = "block";

    const lane =
        lanes[Math.floor(Math.random()*3)];

    currentAnswer = lane;

    let startX;
    let startY = 200;

    let endX;
    let endY = 470;

    if(lane==="left"){
        startX = 250;
        endX = 320;
    }

    if(lane==="middle"){
        startX = 430;
        endX = 430;
    }

    if(lane==="right"){
        startX = 610;
        endX = 540;
    }

    ball.style.transition = "none";
    ball.style.left = startX + "px";
    ball.style.top = startY + "px";

    void ball.offsetWidth;

    let reactionTime =
        1500 + Math.random()*500;

    ball.style.transition =
        `all ${reactionTime}ms linear`;

    ball.style.left = endX + "px";
    ball.style.top = endY + "px";

    timeout = setTimeout(()=>{
        miss();
    }, reactionTime);
}

function playerAction(action){

    if(!gameRunning) return;

    if(action === currentAnswer){

        clearTimeout(timeout);

        combo++;
        score++;

        if(combo >= 20){
            msg.innerHTML = "🏆 LEGENDARY!";
        }
        else if(combo >= 10){
            msg.innerHTML = "⚡ AMAZING!";
        }
        else if(combo >= 5){
            msg.innerHTML = "🔥 HOT!";
        }
        else{
            msg.innerHTML = "PERFECT!";
        }

        updateUI();

        setTimeout(()=>{
            msg.innerHTML = "";
        },400);

        spawnBall();

    }else{
        miss();
    }
}

function miss(){

    gameRunning = false;

    msg.innerHTML =
    "❌ GAME OVER<br>分數："+score;

    ball.style.display = "none";
}

</script>

</body>
</html>
